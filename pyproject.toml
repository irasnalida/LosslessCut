[project]
name = "losslesscut"
version = "0.1.0"
description = "A keyframe-based lossless video cutter built with PySide6 and ffmpeg"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6-essentials>=6.12.0",
]

[project.scripts]
losslesscut = "losslesscut.app:main"

[project.gui-scripts]
losslesscut-gui = "losslesscut.app:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pytest>=9.2.0",
    "pytest-qt>=4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/losslesscut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that invoke ffmpeg and ffprobe",
]
